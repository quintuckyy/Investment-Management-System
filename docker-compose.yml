# One command to run the whole system:  docker compose up --build
#
#   Frontend   http://localhost:8080      (log in with admin / admin12345 or viewer / viewer12345)
#   API docs   http://localhost:8000/api/docs/
#
# The demo logins and sample data are for evaluation only. For anything real, set
# SEED_SAMPLE_DATA=false and provide your own SECRET_KEY and POSTGRES_PASSWORD.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: investment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d investment_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-demo-only-secret-key-change-me-before-real-use}
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DB_NAME: investment_db
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_HOST: db
      DB_PORT: "5432"
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
